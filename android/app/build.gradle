plugins {
    id 'com.android.application'
}

// Firma de la versión release: se lee de android/keystore.properties (ver README)
def ksFile = rootProject.file('keystore.properties')
def ksProps = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'com.isocity.game'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.isocity.game'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.2.1'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // El archivo generado lleva la versión en el nombre: IsoCity-1.2.1.apk (los de depuración, IsoCity-1.2.1-debug.apk)
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "IsoCity-${variant.versionName}${variant.buildType.name == 'release' ? '' : '-' + variant.buildType.name}.apk"
        }
    }
}

// Tras assembleRelease, el APK firmado se copia a la carpeta raíz del proyecto con su versión: IsoCity-<versión>.apk
tasks.register('copyApk') {
    doNotTrackState('copia el APK a la carpeta raíz del proyecto, que contiene archivos que Gradle no puede hashear')
    doLast {
        copy {
            from layout.buildDirectory.file("outputs/apk/release/IsoCity-${android.defaultConfig.versionName}.apk")
            into "$rootDir/.."
        }
    }
}
tasks.matching { it.name == 'assembleRelease' }.configureEach { finalizedBy 'copyApk' }

// El juego web (index.html, css/, js/) se copia a los assets antes de cada compilación,
// así la carpeta raíz del proyecto es la única fuente de verdad.
tasks.register('copyWeb', Copy) {
    from("$rootDir/..") {
        include 'index.html', 'icon.svg', 'css/**', 'js/**'
    }
    into "$projectDir/src/main/assets/www"
}
tasks.named('preBuild') { dependsOn 'copyWeb' }
